[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleza-bot-sdk"
version = "1.0.0"
description = "Python SDK for the Eleza Bot API: long polling, webhooks, keyboards, media, inline mode and Eli posts."
readme = "README.en.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Eleza", email = "dev@eleza.me" }]
keywords = ["eleza", "bot", "bot-api", "sdk", "messenger"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://eleza.me/bots"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eleza_bot = ["py.typed"]
